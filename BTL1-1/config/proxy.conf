# Virtual hosts of the reverse proxy (start_proxy.py, default port 8080).
# Adapt the addresses to your machines. The proxy chooses the block by the
# Host header of the request.

# http://localhost:8080  ->  web UI of peer1
host "localhost:8080" {
    proxy_pass http://127.0.0.1:8000;
}

# http://127.0.0.1:8080  ->  tracker status page and API
host "127.0.0.1:8080" {
    proxy_pass http://127.0.0.1:8001;
}

# curl -H "Host: app.local" http://127.0.0.1:8080/index.html
# Two static backends (start_backend.py on 9000 and 9001), round-robin.
host "app.local" {
    proxy_set_header Host $host;

    proxy_pass http://127.0.0.1:9000;
    proxy_pass http://127.0.0.1:9001;

    dist_policy round-robin
}
