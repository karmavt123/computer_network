# Reverse proxy virtual hosts (see README, section "Proxy").
# host "<Host header>" { proxy_pass http://ip:port; [proxy_set_header ..;] [dist_policy ..;] }

# Browser entry point: http://localhost:8080 -> tracker (login + admin dashboard)
host "localhost:8080" {
    proxy_pass http://127.0.0.1:9000;
}

host "127.0.0.1:8080" {
    proxy_pass http://127.0.0.1:9000;
}

# Peer UIs reachable by name (add "127.0.0.1 peer1.local peer2.local" to /etc/hosts)
host "peer1.local:8080" {
    proxy_pass http://127.0.0.1:9101;
}

host "peer2.local:8080" {
    proxy_pass http://127.0.0.1:9102;
}

# Load balancing demo: two backends served round-robin
host "app.local:8080" {
    proxy_set_header Host $host;

    proxy_pass http://127.0.0.1:9201;
    proxy_pass http://127.0.0.1:9202;

    dist_policy round-robin
}
