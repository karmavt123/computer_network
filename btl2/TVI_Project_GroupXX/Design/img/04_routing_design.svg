<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" font-family="Helvetica, Arial, sans-serif">
<rect width="1400" height="760" fill="white"/>
<text x="700.0" y="26" font-size="19" font-weight="bold" text-anchor="middle">Routing design: eBGP to ISPs, iBGP overlay over GRE/IPsec (AS 65000), OSPF/OSPFv3 underlay per site</text>
<rect x="15" y="45" width="1370" height="150" rx="12" fill="#FFF1E6" stroke="#888" stroke-dasharray="6 4"/><text x="28" y="65" font-size="13" font-weight="bold" fill="#333">Provider layer - eBGP (AS64501 / AS64502 / AS64510)</text>
<rect x="120" y="80" width="220" height="60" rx="8" fill="#EDEDED" stroke="#444"/>
<text x="230.0" y="100" font-size="12" text-anchor="middle" font-weight="bold">ISP-A AS64501</text>
<text x="230.0" y="116" font-size="11" text-anchor="middle" >default-originate to TVI</text>
<text x="230.0" y="132" font-size="11" text-anchor="middle" >203.0.113.0/24</text>
<rect x="590" y="80" width="220" height="60" rx="8" fill="#D9D9D9" stroke="#444"/>
<text x="700.0" y="100" font-size="12" text-anchor="middle" font-weight="bold">INTERNET AS64510</text>
<text x="700.0" y="116" font-size="11" text-anchor="middle" >8.8.8.8/32 (SaaS stand-in)</text>
<text x="700.0" y="132" font-size="11" text-anchor="middle" >transit via both ISPs</text>
<rect x="1060" y="80" width="220" height="60" rx="8" fill="#EDEDED" stroke="#444"/>
<text x="1170.0" y="100" font-size="12" text-anchor="middle" font-weight="bold">ISP-B AS64502</text>
<text x="1170.0" y="116" font-size="11" text-anchor="middle" >default-originate to TVI</text>
<text x="1170.0" y="132" font-size="11" text-anchor="middle" >198.51.100.0/24</text>
<line x1="340" y1="110" x2="590" y2="110" stroke="#ed7d31" stroke-width="2"/>
<text x="465.0" y="106.0" font-size="10.5" fill="#ed7d31" text-anchor="middle" font-weight="bold" paint-order="stroke" stroke="white" stroke-width="4">eBGP</text>
<line x1="810" y1="110" x2="1060" y2="110" stroke="#ed7d31" stroke-width="2"/>
<text x="935.0" y="106.0" font-size="10.5" fill="#ed7d31" text-anchor="middle" font-weight="bold" paint-order="stroke" stroke="white" stroke-width="4">eBGP</text>
<rect x="15" y="215" width="1370" height="220" rx="12" fill="#EAF6E6" stroke="#888" stroke-dasharray="6 4"/><text x="28" y="235" font-size="13" font-weight="bold" fill="#333">Overlay - iBGP AS 65000 over GRE/IPsec (IKEv1 PSK, AES-256/SHA-256/DH14); IPv4 + IPv6 address families</text>
<rect x="60" y="330" width="260" height="80" rx="8" fill="#F8CBAD" stroke="#444"/>
<text x="190.0" y="350" font-size="12" text-anchor="middle" font-weight="bold">HCMC-EDGE-RTR01 / 02</text>
<text x="190.0" y="366" font-size="11" text-anchor="middle" >Route reflectors (HQ cluster)</text>
<text x="190.0" y="382" font-size="11" text-anchor="middle" >eBGP to ISP-A / ISP-B</text>
<text x="190.0" y="398" font-size="11" text-anchor="middle" >advertise 10.1.0.0/16, 2001:db8:1::/48</text>
<rect x="560" y="250" width="260" height="80" rx="8" fill="#F8CBAD" stroke="#444"/>
<text x="690.0" y="270" font-size="12" text-anchor="middle" font-weight="bold">HANOI-EDGE-RTR01 / 02</text>
<text x="690.0" y="286" font-size="11" text-anchor="middle" >RR clients, local-pref 200 / 150</text>
<text x="690.0" y="302" font-size="11" text-anchor="middle" >eBGP default only from ISP</text>
<text x="690.0" y="318" font-size="11" text-anchor="middle" >advertise 10.2.0.0/16, 2001:db8:2::/48</text>
<rect x="1000" y="330" width="280" height="80" rx="8" fill="#F8CBAD" stroke="#444"/>
<text x="1140.0" y="350" font-size="12" text-anchor="middle" font-weight="bold">DANANG-EDGE-RTR01 / 02</text>
<text x="1140.0" y="366" font-size="11" text-anchor="middle" >RR clients, local-pref 200 / 150</text>
<text x="1140.0" y="382" font-size="11" text-anchor="middle" >eBGP default only from ISP</text>
<text x="1140.0" y="398" font-size="11" text-anchor="middle" >advertise 10.3.0.0/16, 2001:db8:3::/48</text>
<line x1="320" y1="350" x2="560" y2="290" stroke="#2e8b57" stroke-width="3" stroke-dasharray="9 5"/>
<text x="440.0" y="316.0" font-size="10.5" fill="#2e8b57" text-anchor="middle" font-weight="bold" paint-order="stroke" stroke="white" stroke-width="4">Tunnel1 (ISP-A) / Tunnel2 (ISP-B)</text>
<line x1="320" y1="390" x2="1000" y2="370" stroke="#2e8b57" stroke-width="3" stroke-dasharray="9 5"/>
<text x="660.0" y="376.0" font-size="10.5" fill="#2e8b57" text-anchor="middle" font-weight="bold" paint-order="stroke" stroke="white" stroke-width="4">Tunnel3 (ISP-A) / Tunnel4 (ISP-B)</text>
<text x="700" y="207" font-size="11.5" fill="#c55a11" text-anchor="middle" font-weight="bold">Every site: EDGE-RTR01 -> ISP-A, EDGE-RTR02 -> ISP-B (eBGP, default route only, prefix-lists in/out, MD5)</text>
<text x="30" y="428" font-size="11" fill="#555">Branches never backhaul Internet traffic: local NAT + default from their own ISP (split tunnel); only corporate prefixes use the tunnels.</text>
<rect x="15" y="455" width="1370" height="290" rx="12" fill="#EAF1FB" stroke="#888" stroke-dasharray="6 4"/><text x="28" y="475" font-size="13" font-weight="bold" fill="#333">Underlay - OSPF 10 / OSPFv3 10, area 0, independent in each site</text>
<rect x="60" y="490" width="380" height="110" rx="8" fill="#FFFFFF" stroke="#444"/>
<text x="250.0" y="510" font-size="12" text-anchor="middle" font-weight="bold">HCMC (HQ)</text>
<text x="250.0" y="526" font-size="11" text-anchor="middle" >CORE-SW01/02: SVIs, VLAN 90 transit, routed /30 to edges</text>
<text x="250.0" y="542" font-size="11" text-anchor="middle" >EDGE-RTR01/02: originate default (metric 10 / 20)</text>
<text x="250.0" y="558" font-size="11" text-anchor="middle" >Loopback0 = router-id = management</text>
<text x="250.0" y="574" font-size="11" text-anchor="middle" >IPv6: OSPFv3 address-family ipv6 unicast</text>
<rect x="520" y="490" width="380" height="110" rx="8" fill="#FFFFFF" stroke="#444"/>
<text x="710.0" y="510" font-size="12" text-anchor="middle" font-weight="bold">Hanoi</text>
<text x="710.0" y="526" font-size="11" text-anchor="middle" >EDGE-RTR01/02 adjacency on VLAN 99 sub-interface</text>
<text x="710.0" y="542" font-size="11" text-anchor="middle" >user sub-interfaces passive but advertised</text>
<text x="710.0" y="558" font-size="11" text-anchor="middle" >HSRP tracking: route to 10.1.0.0/16 (via BGP)</text>
<text x="710.0" y="574" font-size="11" text-anchor="middle" >no HQ routes in OSPF - BGP only</text>
<rect x="980" y="490" width="380" height="110" rx="8" fill="#FFFFFF" stroke="#444"/>
<text x="1170.0" y="510" font-size="12" text-anchor="middle" font-weight="bold">Da Nang</text>
<text x="1170.0" y="526" font-size="11" text-anchor="middle" >EDGE-RTR01/02 adjacency on VLAN 99 sub-interface</text>
<text x="1170.0" y="542" font-size="11" text-anchor="middle" >user + IoT sub-interfaces passive but advertised</text>
<text x="1170.0" y="558" font-size="11" text-anchor="middle" >HSRP tracking: route to 10.1.0.0/16 (via BGP)</text>
<text x="1170.0" y="574" font-size="11" text-anchor="middle" >no HQ routes in OSPF - BGP only</text>
<text x="60" y="640" font-size="12" font-weight="bold">Why no redistribution?</text><text x="60" y="660" font-size="11.5">BGP and OSPF never exchange routes except one-way: edges inject a default into OSPF. This removes the classic mutual-redistribution</text><text x="60" y="676" font-size="11.5">loop/flap risk, keeps each OSPF domain tiny (fast convergence) and makes the three site aggregates the only inter-site state.</text><text x="60" y="702" font-size="11.5" font-weight="bold">Failover chain:</text><text x="60" y="718" font-size="11.5">tunnel/BGP session down (hold 9 s) -> route 10.1.0.0/16 disappears -> HSRP track -30 -> peer router preempts -> traffic uses the other ISP / tunnel.</text>
</svg>