route-map RM-LOCALPREF permit 10
 set local-preference 200
!
router bgp 65000
 bgp router-id 10.2.255.1
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 203.0.113.5 remote-as 64501
 neighbor 203.0.113.5 description eBGP ISP-A-RTR
 neighbor 203.0.113.5 password TVI-BGP-Lab-2026
 neighbor 203.0.113.5 timers 3 9
 neighbor 10.255.1.1 remote-as 65000
 neighbor 10.255.1.1 description iBGP HCMC-EDGE-RTR01 (Tunnel1)
 neighbor 10.255.1.1 password TVI-BGP-Lab-2026
 neighbor 10.255.1.1 timers 3 9
 neighbor 2001:db8:ff:1::1 remote-as 65000
 neighbor 2001:db8:ff:1::1 description iBGPv6 HCMC-EDGE-RTR01 (Tunnel1)
 neighbor 2001:db8:ff:1::1 password TVI-BGP-Lab-2026
 neighbor 2001:db8:ff:1::1 timers 3 9
 !
 address-family ipv4
  network 10.2.0.0 mask 255.255.0.0
  neighbor 203.0.113.5 activate
  neighbor 203.0.113.5 prefix-list PL-ISP-IN in
  neighbor 203.0.113.5 prefix-list PL-NONE-OUT out
  neighbor 10.255.1.1 activate
  neighbor 10.255.1.1 prefix-list PL-TVI-AGG out
  neighbor 10.255.1.1 route-map RM-LOCALPREF out
 exit-address-family
 !
