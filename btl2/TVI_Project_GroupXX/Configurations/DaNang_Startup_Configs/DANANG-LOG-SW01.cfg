! ======================================================================
! DANANG-LOG-SW01  -  Logistics / IoT access switch
! Image: Cisco IOSvL2 (EVE-NG)   |   Access switch - RSTP, DHCP snooping, DAI, port security, BPDU guard
! Generated by Tools/gen_configs.py from Tools/tvi_model.py - do not edit by hand.
! ======================================================================
!
hostname DANANG-LOG-SW01
!
service timestamps debug datetime msec localtime
service timestamps log datetime msec localtime
service password-encryption
no service pad
no ip domain-lookup
ip domain-name tvi.local
no ip source-route
no ip http server
no ip http secure-server
ip cef
!
! ---- AAA / local accounts (type-5 hashes, no clear-text secrets) ----
aaa new-model
aaa authentication login default local
aaa authentication login CONSOLE none
aaa authorization exec default local
enable secret 5 $1$tvi1$nIhK2v9u5/NWg8olcD37n/
username netadmin privilege 15 secret 5 $1$tvi1$nIhK2v9u5/NWg8olcD37n/
!
clock timezone ICT 7 0
ntp server 10.1.100.10
logging host 10.1.99.100
logging trap informational
logging buffered 16384
!
banner motd # Unauthorized access to TVI Corporate Infrastructure is prohibited. All activity is monitored and logged. #
!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
ip access-list standard VTY-MGMT
 permit 10.1.99.0 0.0.0.255
 permit 10.2.99.0 0.0.0.255
 permit 10.3.99.0 0.0.0.255
 deny any log
!
line con 0
 exec-timeout 30 0
 logging synchronous
 login authentication CONSOLE
line vty 0 4
 access-class VTY-MGMT in
 exec-timeout 10 0
 logging synchronous
 transport input ssh
!
no ip routing
!
vtp mode transparent
!
vlan 10
 name EXEC_FINANCE
vlan 20
 name RND_ENGINEERING
vlan 30
 name LOGISTICS_OPS
vlan 40
 name VOICE
vlan 50
 name GUEST
vlan 60
 name IOT_SENSORS
vlan 61
 name IOT_AUTOMATION
vlan 62
 name IOT_SCANNERS_CCTV
vlan 99
 name MANAGEMENT
vlan 998
 name NATIVE_UNUSED
vlan 999
 name BLACKHOLE
!
! ---- Spanning tree ----
spanning-tree mode rapid-pvst
spanning-tree extend system-id
spanning-tree portfast default
spanning-tree portfast bpduguard default
errdisable recovery cause bpduguard psecure-violation
errdisable recovery interval 300
!
! ---- Layer-2 security: DHCP snooping + Dynamic ARP Inspection on user VLANs ----
ip dhcp snooping
ip dhcp snooping vlan 10,20,30,40,50,60,61,62
no ip dhcp snooping information option
ip arp inspection vlan 10,20,30,40,50,60,61,62
ip arp inspection validate src-mac dst-mac ip
!
interface Vlan99
 description Management
 ip address 10.3.99.11 255.255.255.0
 no shutdown
!
ip default-gateway 10.3.99.1
!
interface GigabitEthernet0/0
 description UPLINK -> DANANG-EDGE-RTR01 Gi0/1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 998
 switchport trunk allowed vlan 10,20,30,40,50,60,61,62,99
 switchport nonegotiate
 ip dhcp snooping trust
 ip arp inspection trust
 no shutdown
!
interface GigabitEthernet0/1
 description UPLINK -> DANANG-EDGE-RTR02 Gi0/1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 998
 switchport trunk allowed vlan 10,20,30,40,50,60,61,62,99
 switchport nonegotiate
 ip dhcp snooping trust
 ip arp inspection trust
 no shutdown
!
interface GigabitEthernet0/2
 description PC-DN-LOG01 (VLAN 30 LOGISTICS_OPS)
 switchport mode access
 switchport access vlan 30
 switchport nonegotiate
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 spanning-tree portfast
 spanning-tree bpduguard enable
 storm-control broadcast level 5.00
 ip dhcp snooping limit rate 15
 ip arp inspection limit rate 50
 no shutdown
!
interface GigabitEthernet0/3
 description PC-DN-IOT01 (VLAN 60 IOT_SENSORS)
 switchport mode access
 switchport access vlan 60
 switchport nonegotiate
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 spanning-tree portfast
 spanning-tree bpduguard enable
 storm-control broadcast level 5.00
 ip dhcp snooping limit rate 15
 ip arp inspection limit rate 50
 no shutdown
!
interface GigabitEthernet1/0
 description UNUSED - blackhole VLAN, shut
 switchport mode access
 switchport access vlan 999
 shutdown
!
interface GigabitEthernet1/1
 description UNUSED - blackhole VLAN, shut
 switchport mode access
 switchport access vlan 999
 shutdown
!
interface GigabitEthernet1/2
 description UNUSED - blackhole VLAN, shut
 switchport mode access
 switchport access vlan 999
 shutdown
!
interface GigabitEthernet1/3
 description UNUSED - blackhole VLAN, shut
 switchport mode access
 switchport access vlan 999
 shutdown
!
